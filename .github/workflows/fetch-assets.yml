name: Fetch asset pack

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Asset page (e.g. https://kenney.nl/assets/mini-arena) or direct .zip link"
        required: true
        type: string
      dest:
        description: "Folder name under models/"
        required: true
        type: string
      keep:
        description: "Glob of files to keep inside the pack (others are deleted to keep the repo small)"
        required: false
        type: string
        default: "*.glb *.png *.txt *.md"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download and unpack
        env:
          URL: ${{ inputs.url }}
          DEST: ${{ inputs.dest }}
          KEEP: ${{ inputs.keep }}
        run: |
          set -euo pipefail
          case "$DEST" in ""|*..*|/*|*/*) echo "dest must be a plain folder name"; exit 1;; esac
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          mkdir -p work
          if [[ "$URL" == *.zip ]]; then
            ZIP="$URL"
          else
            code=$(curl -sSL -A "$UA" -w "%{http_code}" "$URL" -o work/page.html || true)
            echo "page: HTTP $code, $(wc -c < work/page.html) bytes"
            # attributes may use single or double quotes
            ZIP=$(grep -oiE "(href|src|action|data-[a-z-]+)=['\"][^'\"]*\.zip[^'\"]*['\"]" work/page.html | head -1 | sed -E "s/^[^=]*=['\"]//; s/['\"]$//" || true)
            if [ -z "$ZIP" ]; then
              echo "no .zip link found on the page; tokens mentioning zip/download:"
              grep -oiE "[^'\" <>]*(zip|download)[^'\" <>]*" work/page.html | sort -u | head -40 || true
              echo "--- page head ---"; head -c 1500 work/page.html; echo
              exit 1
            fi
            [[ "$ZIP" == http* ]] || ZIP="https://$(echo "$URL" | awk -F/ '{print $3}')${ZIP}"
          fi
          echo "downloading: $ZIP"
          curl -sSL -A "$UA" -e "$URL" "$ZIP" -o work/pack.zip
          ls -l work/pack.zip; file work/pack.zip
          rm -rf "models/$DEST"; mkdir -p "models/$DEST"
          unzip -q work/pack.zip -d "models/$DEST"
          # keep only the useful formats; drop per-model preview renders and isometric sprites
          find "models/$DEST" -type f > work/all.txt
          find "models/$DEST" -type d \( -iname Previews -o -iname Isometric -o -iname "FBX format" -o -iname "OBJ format" \) -prune -exec rm -rf {} +
          args=(); for g in $KEEP; do args+=( ! -iname "$g" ); done
          find "models/$DEST" -type f "${args[@]}" -delete
          find "models/$DEST" -type d -empty -delete
          echo "source: $ZIP" > "models/$DEST/SOURCE.txt"
          echo "kept $(find "models/$DEST" -type f | wc -l) of $(wc -l < work/all.txt) files"
          du -sh "models/$DEST"
          find "models/$DEST" -type f | sort > work/kept.txt
          head -n 300 work/kept.txt
      - name: Commit
        env:
          DEST: ${{ inputs.dest }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add models
          git commit -m "Add asset pack: $DEST" || echo "nothing to commit"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed; retrying"; sleep $((attempt * 7))
          done
          exit 1
